# 해당 파일에 적는 것은 pmh가 대상을 어떻게 알아낼지를 적는 설정 파일임

global:
  scrape_interval: 15s

scrape_configs:
  # 비교하기위한 대상 pmh - pmh가 자기 자신을 긂음
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # eureka 서버 - sd로는 못찾음, 자기 자신을 등록하지 않기 때문
  # sd의 단일 장애점이기 때문에 중요(로컬 한정) 배포시에는 따로 관측
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8761']

  #PeopleCore - eureka에 등록된 것을 자동 발견
  # 아래 줄로 자동 발견된 것을 peoplecore-services라고 라벨링
  - job_name: 'peoplecore-services'
    # sd가 eureka에 물음
    eureka_sd_configs:
      - server: 'http://host.docker.internal:8761/eureka'
    #여기까지 eureka에 등록된 각 서비스마다 초기 라벨을 붙임 당연히 peoplecore-services로
    metrics_path: '/actuator/prometheus'
    #이렇게 했을 시 각 서비스 모듈이 하나의 잡으로 뭉침

#   해당 줄로 각 target마다 리라벨링
    relabel_configs:
    #__address__ 를 hostname:port 대신 ip_addr:port로 리라벨링
    #api-gateway에 prefer-ip-address설정이 없어 추가 후에 한번더 막기 위해 전환
      - source_labels: [__meta_eureka_app_instance_ip_addr,__meta_eureka_app_instance_port]
        separator: ':'
        target_label: __address__

    # job 라벨을 eureka 앱 이름(소문자)으로 - 안 할시 4개가 한 job으로 뭉침
    # eureka에 등록된 이름 그대로 리라벨링
      - source_labels: [__meta_eureka_app_name]
        target_label: job
        action: lowercase
